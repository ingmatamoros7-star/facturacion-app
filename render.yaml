services:
  - type: web
    name: facturacion-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/data
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: facturacion-data
      mountPath: /opt/render/project/data
      sizeGB: 1
