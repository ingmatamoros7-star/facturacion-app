services:
  - type: web
    name: facturacion-app
    runtime: node
    # Plan gratuito: los datos NO viven en el servidor sino en Turso (libSQL),
    # por eso no se necesita disco persistente ni plan de pago.
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Define estas dos en el panel de Render (NO las subas al repo):
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
