services:
  - type: web
    name: facturacion-app
    runtime: node
    # "starter" (~7 USD/mes) permite disco persistente para que la base
    # SQLite NO se borre. Si solo quieres probar gratis, cambia a "free" y
    # elimina la sección "disk" (los datos serán temporales).
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /opt/render/project/data
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: facturacion-data
      mountPath: /opt/render/project/data
      sizeGB: 1
